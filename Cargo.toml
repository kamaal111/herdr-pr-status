[package]
name = "herdr-pr-status"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Show associated GitHub PR numbers in Herdr workspace rows"
license = "MIT"
keywords = ["herdr", "github", "workspace"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
toml_edit = "0.22.27"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
