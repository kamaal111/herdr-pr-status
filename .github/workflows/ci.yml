name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pytest_options: '--repeat 2'
          - os: macos-latest
            # Hosted macOS runners have no Docker daemon; Linux runs snapshots.
            pytest_options: '-m "not snapshot"'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: ${{ matrix.pytest_options }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - run: just ready
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: sidebar-snapshots
          path: |
            target/snapshots/*/*.png
            target/snapshots/*/*.txt
            target/snapshots/*/*.ansi
            target/snapshots/*/*.log
          retention-days: 7
          if-no-files-found: ignore
