name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - run: just ready
  snapshots:
    name: Herdr sidebar snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - run: just test-snapshots --repeat 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-snapshots
          path: |
            target/snapshots/*/*.png
            target/snapshots/*/*.txt
            target/snapshots/*/*.ansi
            target/snapshots/*/*.log
          retention-days: 7
          if-no-files-found: ignore
